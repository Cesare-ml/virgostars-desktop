[package]
name = "virgostars-desktop-spike"
version = "0.0.1"
description = "Offline synthetic VirgoStars chart renderer shell (unreleased prototype)"
authors = ["VirgoStars project"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "virgostars_desktop_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The canonical astronomy provider, VirgoStars-Ephemeris (CPAL-1.0). Without it nothing is calculated.
default = ["virgostars-ephemeris"]
virgostars-ephemeris = ["dep:virgostars-ephemeris-core", "dep:serde_json"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled", "serialize"] }
chacha20poly1305 = "0.10"
zeroize = "1"
getrandom = "0.3"
base64 = "0.23"
sha2 = "0.10"
url = "2.5"
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native"] }
# Pinned to one reviewed commit of the Ephemeris repository; never a floating branch.
virgostars-ephemeris-core = { git = "https://github.com/Cesare-ml/VirgoStars-Ephemeris", rev = "6835e00e4b4ba5fc52d882a793e2dfa2b2a436aa", optional = true }
serde_json = { version = "1", optional = true }
[dev-dependencies]
serde_json = "1"
