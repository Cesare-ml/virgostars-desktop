[package]
name = "virgostars-desktop-spike"
version = "0.0.1"
description = "Offline synthetic VirgoStars chart renderer shell (unreleased prototype)"
authors = ["VirgoStars project"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "virgostars_desktop_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Temporary astronomy provider. Links AGPL-3.0 code: see docs/SWISS_EPHEMERIS_PROVIDER.md.
swiss-ephemeris = ["dep:sweph-sys"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sweph-sys = { version = "=0.3.0", optional = true }
[dev-dependencies]
serde_json = "1"
