[package]
name = "virgostars-desktop-spike"
version = "0.0.1"
description = "Offline synthetic VirgoStars chart renderer shell (unreleased prototype)"
authors = ["VirgoStars project"]
edition = "2021"
rust-version = "1.90"

[features]
# Explicit opt-in for a local synthetic staging backend, compiled only in DEBUG.
# Normal builds keep this command absent; no live cloud token system exists yet.
copilot-staging = ["dep:reqwest", "dep:serde_json"]

[lib]
name = "virgostars_desktop_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# Optional and unused by release. Native-only, no WebView HTTP plugin.
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }
serde_json = { version = "1", optional = true }
