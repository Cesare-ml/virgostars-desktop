[package]
name = "virgostars-desktop-spike"
version = "0.0.5"
description = "Offline synthetic VirgoStars chart renderer shell (unreleased prototype)"
authors = ["VirgoStars project"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "virgostars_desktop_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The canonical astronomy provider, VirgoStars-Ephemeris (CPAL-1.0). Without it nothing is calculated.
default = ["virgostars-ephemeris", "virgostars-event-ephemeris"]
virgostars-ephemeris = ["dep:virgostars-ephemeris-core"]
virgostars-event-ephemeris = ["dep:virgostars-events"]
# Only for disposable local Windows acceptance builds; never used by release scripts.
updater-loopback-test = []
# Explicit build-time staging opt-in; never permits production endpoints.
staging-connected-account = []
# An explicit release build uses a fixed production origin pair.
production-connected-account = ["staging-connected-account"]
# Explicit candidate; backend and migration must be staged before use.
persistent-connected-account = ["staging-connected-account"]
# Disposable debug-only local acceptance; forbidden in release builds.
de441-loopback-test = ["virgostars-ephemeris"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled", "serialize"] }
chacha20poly1305 = "0.10"
zeroize = "1"
getrandom = "0.3"
open = { version = "=5.4.5", features = ["shellexecute-on-windows"] }
base64 = "0.23"
url = "2.5"
httparse = "1.10"
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native"] }
# Required by both the native account-token response parser and the ephemeris adapter.
serde_json = "1"
# Pinned to one reviewed commit of the Ephemeris repository; never a floating branch.
virgostars-ephemeris-core = { git = "https://github.com/Cesare-ml/VirgoStars-Ephemeris", rev = "28f4ce81fd5bf9a0434faec8fcb5aecdde378856", optional = true }
virgostars-events = { package = "virgostars-event-ephemeris", git = "https://github.com/Cesare-ml/VirgoStars-Event-Ephemeris", rev = "f78a3b65d771dfd14e0028b3c767397be7fb93d7", optional = true }
tauri-plugin-updater = "=2.14.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "blocking", "rustls"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
fs2 = "=0.4.3"
sha2 = "0.10"
[dev-dependencies]
serde_json = "1"
tempfile = "3"
minisign-verify = "0.3"
