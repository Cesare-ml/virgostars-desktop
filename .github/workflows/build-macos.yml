# Manual macOS smoke builds only. Never signs, notarizes or publishes a GitHub Release.
# The source script pins sibling repos and verifies downloadable public data by SHA-256.
name: macOS DMG · manual

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-dmg-manual-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-macos-dmg:
    name: DMG ${{ matrix.arch }}
    # The macOS ARM64 and Intel labels are standard GitHub-hosted runners.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel

    steps:
      - name: Checkout VirgoStars Desktop
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up native Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}

      - name: Verify macOS toolchain and native architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(node -p 'process.arch')" = "${{ matrix.arch }}"
          xcode-select -p
          xcrun --find clang
          python3 --version
          rustup default stable
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            rustup target add aarch64-apple-darwin
          else
            rustup target add x86_64-apple-darwin
          fi
          rustc --version
          cargo --version

      - name: Build native macOS .app and .dmg (test only)
        shell: bash
        env:
          CI: 'true'
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail
          npm run build:mac

      - name: Verify build report, DMG and SHA-256
        shell: bash
        env:
          EXPECTED_MAC_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          node scripts/mac/verify-ci-artifact.mjs

      - name: Upload unsigned DMG, checksum and build report
        uses: actions/upload-artifact@v4
        with:
          name: virgostars-macos-${{ matrix.arch }}-test-${{ github.run_number }}
          path: .local/mac/output/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
