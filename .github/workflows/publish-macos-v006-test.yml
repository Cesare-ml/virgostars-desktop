# One-time promotion of the verified unsigned v0.0.6 macOS DMGs.
# A separate test prerelease, not the official Windows v0.0.6 and never a stable Mac release.
name: Publish macOS v0.0.6 test prerelease
on:
  push:
    branches:
      - build/macos-v0.0.6-snapshot-20261122
    paths:
      - .github/workflows/publish-macos-v006-test.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: macos-v006-test-prerelease-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout audited diagnostic branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact successful source, tag and artifacts run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = "build/macos-v0.0.6-snapshot-20261122"
          test "$(git rev-parse refs/tags/v0.0.6)" = "aea1bcd248ba742e142ae666cc8de8fc6536978d"
          git merge-base --is-ancestor aea1bcd248ba742e142ae666cc8de8fc6536978d 40c8f9055c9035eb10472d8c4b07bc613d8c9b51
          test "$(git show 40c8f9055c9035eb10472d8c4b07bc613d8c9b51:package.json | jq -r .version)" = "0.0.6"
          test "$(gh api repos/Cesare-ml/virgostars-desktop/actions/runs/45271186416 --jq .head_sha)" = "40c8f9055c9035eb10472d8c4b07bc613d8c9b51"
          test "$(gh api repos/Cesare-ml/virgostars-desktop/actions/runs/45271186416 --jq .conclusion)" = "success"
          if gh release view v0.0.6-macos-test1 >/dev/null 2>&1; then
            echo "Existing test prerelease detected: verify in final step; never overwrite"
            echo "ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
          fi

      - name: Download exact arm64 test artifact from successful build
        if: env.ALREADY_PUBLISHED != 'true'
        uses: actions/download-artifact@v4
        with:
          name: virgostars-macos-v0.0.6-arm64-test-11
          run-id: 45271186416
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .local/mac/publish-in/arm64

      - name: Download exact Intel test artifact from successful build
        if: env.ALREADY_PUBLISHED != 'true'
        uses: actions/download-artifact@v4
        with:
          name: virgostars-macos-v0.0.6-x64-test-11
          run-id: 45271186416
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .local/mac/publish-in/x64

      - name: Verify original reports, source SHA, checksum and unnotarized status
        if: env.ALREADY_PUBLISHED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/mac/promote-diagnostic-v006.mjs
          cd .local/mac/publish-v006
          sha256sum --check SHA256SUMS-macos.txt

      - name: Create draft with verified DMGs, SHA256 and build reports
        if: env.ALREADY_PUBLISHED != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create v0.0.6-macos-test1 \
            .local/mac/publish-v006/VirgoStars-Desktop-0.0.6-macos-arm64.dmg \
            .local/mac/publish-v006/VirgoStars-Desktop-0.0.6-macos-x64.dmg \
            .local/mac/publish-v006/SHA256SUMS-macos.txt \
            .local/mac/publish-v006/arm64-build-report.json \
            .local/mac/publish-v006/x64-build-report.json \
            --target 40c8f9055c9035eb10472d8c4b07bc613d8c9b51 \
            --title "VirgoStars Desktop v0.0.6 — macOS unsigned test builds" \
            --notes-file .local/mac/publish-v006/RELEASE-NOTES.md \
            --draft --prerelease
          count="$(gh release view v0.0.6-macos-test1 --json assets --jq '.assets | length')"
          test "$count" = 5
          # Only make it visible after both files and their reports have arrived.
          gh release edit v0.0.6-macos-test1 --draft=false
          echo 'Uploaded both architectures; final independent published-release verification follows'

      - name: Independently confirm public test prerelease and exact DMG hashes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="repos/Cesare-ml/virgostars-desktop/releases/tags/v0.0.6-macos-test1"
          test "$(gh api "$api" --jq .draft)" = false
          test "$(gh api "$api" --jq .prerelease)" = true
          test "$(gh api "$api" --jq .target_commitish)" = "40c8f9055c9035eb10472d8c4b07bc613d8c9b51"
          test "$(gh api "$api" --jq '.assets | length')" = 5
          test "$(gh api "$api" --jq '.assets[] | select(.name=="VirgoStars-Desktop-0.0.6-macos-arm64.dmg") | .digest')" = "sha256:b6dc01ff60c461d444c4dd6d1da41a03686ea12dc5ad0edbde288b157bd64e67"
          test "$(gh api "$api" --jq '.assets[] | select(.name=="VirgoStars-Desktop-0.0.6-macos-x64.dmg") | .digest')" = "sha256:5a13cba10338e654556843d408c6cc5d4cc01bcf4e6f78c0620e40f40acd4dbc"
          gh release view v0.0.6-macos-test1 --json url,isPrerelease,assets --jq '{url, isPrerelease, assetNames: [.assets[].name]}'
