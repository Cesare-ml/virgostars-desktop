# Isolated v0.0.6 source snapshot diagnostic builds, never a public Mac release.
# Full npm test suite runs; known failures are logged and included in the report.
name: macOS v0.0.6 snapshot · diagnostic DMG

on:
  push:
    branches:
      - build/macos-v0.0.6-snapshot-20261122
    paths:
      - .github/workflows/build-macos-v006-snapshot.yml

permissions:
  contents: read

concurrency:
  group: macos-v006-snapshot-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-macos-dmg:
    name: v0.0.6 diagnostic DMG ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel

    steps:
      - name: Checkout v0.0.6-based source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 10

      - name: Validate v0.0.6 ancestry and isolated diagnostic changes
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = "build/macos-v0.0.6-snapshot-20261122"
          git merge-base --is-ancestor aea1bcd248ba742e142ae666cc8de8fc6536978d HEAD
          git diff --name-only aea1bcd248ba742e142ae666cc8de8fc6536978d HEAD > /tmp/modified-mac.txt
          while IFS= read -r name; do
            case "$name" in
              .github/workflows/build-macos-v006-snapshot.yml|scripts/mac/build.mjs) ;;
              *) echo "Unauthorized source change: $name"; exit 1 ;;
            esac
          done < /tmp/modified-mac.txt
          test "$(node -p 'require("./package.json").version')" = "0.0.6"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}

      - name: Setup native toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(node -p 'process.arch')" = "${{ matrix.arch }}"
          xcode-select -p
          xcrun --find clang
          rustup default stable
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            rustup target add aarch64-apple-darwin
          else
            rustup target add x86_64-apple-darwin
          fi
          rustc --version
          cargo --version

      - name: Build unsigned diagnostic DMG (full failing tests disclosed)
        shell: bash
        env:
          CI: 'true'
          CARGO_TERM_COLOR: always
          VIRGOSTARS_MAC_SNAPSHOT_TEST_ONLY: '1'
        run: |
          set -euo pipefail
          npm run build:mac:original

      - name: Validate test report and checksum
        shell: bash
        env:
          EXPECTED_MAC_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          node scripts/mac/verify-ci-artifact.mjs

      - name: Upload test-only artifacts (NOT for public release)
        uses: actions/upload-artifact@v4
        with:
          name: virgostars-macos-v0.0.6-${{ matrix.arch }}-test-${{ github.run_number }}
          path: .local/mac/output/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
