<section class="city-picker" [attr.aria-label]="t('city.title')">
  <label class="city-title" for="offline-city-query">{{t('city.title')}}</label>
  <p class="city-note">{{t('city.note')}}</p>
  <p class="city-note">{{t('city.demoNote')}}</p>
  <!-- Preserve over-limit input for validation rather than browser-truncating it. -->
  <input
    id="offline-city-query"
    type="search"
    class="city-input"
    role="combobox"
    autocomplete="off"
    spellcheck="false"
    [attr.placeholder]="t('city.placeholder')"
    [attr.aria-label]="t('city.title')"
    [attr.aria-autocomplete]="'list'"
    [attr.aria-controls]="'offline-city-options'"
    [attr.aria-expanded]="state.results.length > 0"
    [attr.aria-activedescendant]="state.activeIndex >= 0 ? 'offline-city-option-'+state.activeIndex : null"
    [value]="state.query"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
  >
  <p class="city-status" role="status" aria-live="polite">{{message}}</p>
  <div class="city-results" id="offline-city-options" role="listbox" [attr.aria-label]="t('city.results.label')" *ngIf="state.results.length">
    <button type="button" class="city-option" role="option"
      *ngFor="let city of state.results; let i=index; trackBy:trackCity"
      [id]="'offline-city-option-'+i"
      [attr.aria-selected]="state.activeIndex === i"
      [class.active]="state.activeIndex === i"
      (click)="choose(i)">
      <span class="city-primary">{{city.name}}</span>
      <span class="city-secondary">
        {{city.region || t('city.region.unknown')}}
        <ng-container *ngIf="city.countryName"> · {{city.countryName}}</ng-container>
        · {{city.timeZone || t('city.zone.unknown')}}
      </span>
    </button>
  </div>
  <p class="city-selected" *ngIf="state.selected">
    {{t('city.selected')}}: <strong>{{state.selected.name}}</strong>
  </p>
</section>
