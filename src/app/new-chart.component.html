<form class="new-chart" [attr.aria-label]="t(editChart ? 'archive.edit' : 'form.title')" (submit)="$event.preventDefault(); submit()">
  <label class="field">
    <span>{{t('form.name')}}</span>
    <input type="text" autocomplete="off" spellcheck="false" [attr.maxlength]="maxNameLength"
      [value]="name" (input)="set('name', $event)">
  </label>

  <p class="form-note" *ngIf="historicalMode">{{t('form.historicalNote')}}</p>

  <div class="field-row">
    <label class="field">
      <span>{{t('form.date')}}</span>
      <input *ngIf="!historicalMode" type="date" min="0001-01-01" max="3000-12-31" required [value]="date" (input)="set('date', $event)">
      <input *ngIf="historicalMode" type="text" placeholder="-1000-03-20" required [value]="date" (input)="set('date', $event)">
    </label>
    <label class="field">
      <span>{{t('form.time')}}</span>
      <input *ngIf="!historicalMode" type="time" step="1" [required]="!timeUnknown" [disabled]="timeUnknown" [value]="time" (input)="set('time', $event)">
      <input *ngIf="historicalMode" type="text" placeholder="12:00:00" [required]="!timeUnknown" [disabled]="timeUnknown" [value]="time" (input)="set('time', $event)">
    </label>
  </div>
  <label class="field" *ngIf="!historicalMode"><span><input type="checkbox" [checked]="timeUnknown" (change)="setTimeUnknown($event)"> {{t('sync.unknownTime')}}</span></label>

  <vs-offline-city-picker [locale]="locale" [selectedPlace]="city" [showDemoNotes]="false"
    (locationSelected)="onCitySelected($event)" (locationEdited)="onCityEdited()"></vs-offline-city-picker>

  <label class="field">
    <span>{{t('form.place')}}</span>
    <input type="text" autocomplete="off" spellcheck="false" maxlength="160" [value]="placeName" (input)="set('placeName', $event)">
  </label>

  <div class="field-row">
    <label class="field">
      <span>{{t('form.latitude')}}</span>
      <input type="text" inputmode="decimal" autocomplete="off" maxlength="14" required
        [value]="latitude" (input)="set('latitude', $event)">
    </label>
    <label class="field">
      <span>{{t('form.longitude')}}</span>
      <input type="text" inputmode="decimal" autocomplete="off" maxlength="14" required
        [value]="longitude" (input)="set('longitude', $event)">
    </label>
  </div>

  <label class="field" *ngIf="!historicalMode">
    <span>{{t('form.zone')}}</span>
    <input type="text" autocomplete="off" spellcheck="false" maxlength="120" required
      [value]="timeZone" (input)="set('timeZone', $event)">
  </label>

  <div class="historical-settings" *ngIf="historicalMode">
    <label class="field"><span>{{t('form.calendar')}}</span><select [value]="historicalCalendar" (change)="setHistorical('historicalCalendar',$event)"><option value="julian">{{t('form.julian')}}</option><option value="gregorian">{{t('form.gregorian')}}</option></select></label>
    <label class="field"><span>{{t('form.clock')}}</span><select [value]="historicalOffset" (change)="setHistorical('historicalOffset',$event)"><option value="localMeanSolar">{{t('form.localMeanSolar')}}</option><option value="supplied">{{t('form.offsetManual')}}</option></select></label>
    <label class="field" *ngIf="historicalOffset === 'supplied'"><span>{{t('form.offsetSeconds')}}</span><input type="number" step="any" [value]="historicalOffsetSeconds" (input)="setHistorical('historicalOffsetSeconds',$event)"></label>
    <label class="field"><span>{{t('form.civilUncertainty')}}</span><input type="number" min="0" step="any" [value]="historicalCivilUncertainty" (input)="setHistorical('historicalCivilUncertainty',$event)"></label>
    <label class="field"><span>{{t('form.deltaT')}}</span><select [value]="historicalDeltaT" (change)="setHistorical('historicalDeltaT',$event)"><option value="espenakMeeus2006">{{t('form.deltaTModel')}}</option><option value="supplied">{{t('form.deltaTManual')}}</option></select></label>
    <label class="field" *ngIf="historicalDeltaT === 'supplied'"><span>{{t('form.deltaTSeconds')}}</span><input type="number" step="any" [value]="historicalDeltaTSeconds" (input)="setHistorical('historicalDeltaTSeconds',$event)"></label>
    <label class="field"><span>{{t('form.deltaTUncertainty')}}</span><input type="number" min="0" step="any" [value]="historicalDeltaTUncertainty" (input)="setHistorical('historicalDeltaTUncertainty',$event)"></label>
  </div>

  <p class="form-problem" role="alert" *ngIf="problem">{{problemText}}</p>

  <div class="form-choice" *ngIf="choices.length" role="group" [attr.aria-label]="t('form.choice')">
    <p>{{t('form.choice')}}</p>
    <button type="button" class="form-secondary" *ngFor="let choice of choices" [disabled]="busy"
      (click)="submit(choice.instantUtc)">{{offsetLabel(choice)}}</button>
  </div>

  <div class="form-actions">
    <button type="submit" class="form-primary" [disabled]="busy">{{t(editChart ? 'archive.edit.save' : 'form.submit')}}</button>
    <button type="button" class="form-secondary" *ngIf="!editChart && !historicalMode" [disabled]="busy" (click)="submitNow()">{{t('form.now')}}</button>
  </div>
</form>
